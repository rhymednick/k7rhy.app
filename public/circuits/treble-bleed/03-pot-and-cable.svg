<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Why turning down dulls the sound"><title>Why turning down dulls the sound</title><desc>A pickup feeds a resistor labelled Volume pot. After the resistor the signal wire continues to an amp, and a capacitor labelled Cable connects from that wire to ground. Highs drain away through the capacitor and lows carry on to the amp.</desc><rect width="1200" height="660" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Why turning down dulls the sound</text><polyline data-wire="1" data-net="BUS" points="210,300 350,300" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS" points="450,300 960,300" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="680" cy="300" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="BUS" points="680,300 680,350" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="GND" points="680,450 680,480" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="260" width="170" height="80" rx="14" fill="#f6ecd6" stroke="#1a1a1a" stroke-width="3"/><text x="125" y="308" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Pickup</text><g data-part="RES"><polyline points="350,300 370,300 376,310 388,290 400,310 412,290 424,310 430,300 450,300" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><circle data-terminal="RES.1" cx="350" cy="300" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="RES.2" cx="450" cy="300" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="400" y="274" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Volume pot</text></g><g data-part="CAB"><line x1="680" y1="350" x2="680" y2="393" stroke="#1a1a1a" stroke-width="3"/><line x1="680" y1="407" x2="680" y2="450" stroke="#1a1a1a" stroke-width="3"/><line x1="662" y1="393" x2="698" y2="393" stroke="#1a1a1a" stroke-width="4"/><line x1="662" y1="407" x2="698" y2="407" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="CAB.1" cx="680" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="CAB.2" cx="680" cy="450" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="706" y="405" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Cable</text></g><line x1="662" y1="486" x2="698" y2="486" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="668" y1="493" x2="692" y2="493" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="674" y1="500" x2="686" y2="500" stroke="#444444" stroke-width="4" stroke-linecap="round"/><rect x="960" y="260" width="190" height="80" rx="16" fill="#f6e3e0" stroke="#1a1a1a" stroke-width="3"/><text x="1055" y="310" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Amp</text><text x="400" y="150" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Resistance</text><text x="400" y="176" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The part of the track the</text><text x="400" y="200" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">signal has to push through.</text><text x="400" y="224" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Turned down, there is more.</text><line x1="800" y1="360" x2="800" y2="430" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="800,440 793.0405514542203,425.5928463623572 806.9594485457797,425.5928463623572" fill="#e8590c"/><text x="830" y="396" font-size="20" font-weight="700" text-anchor="start" fill="#e8590c" font-family="Inter, Helvetica, Arial, sans-serif">Highs drain away here</text><text x="830" y="424" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The cable acts like a tiny</text><text x="830" y="448" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">capacitor to ground.</text><line x1="740" y1="250" x2="920" y2="250" stroke="#16803c" stroke-width="4" stroke-linecap="round"/><polygon points="930,250 915.5928463623571,256.9594485457797 915.5928463623571,243.04055145422032" fill="#16803c"/><text x="835" y="230" font-size="20" font-weight="700" text-anchor="middle" fill="#16803c" font-family="Inter, Helvetica, Arial, sans-serif">Lows carry on to the amp</text><text x="40" y="580" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Together the pot and the cable act as a filter: lows get through, highs drain away to ground.</text><text x="40" y="608" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The more I turn down, the more resistance sits ahead of the cable and the more highs drain away.</text></svg>