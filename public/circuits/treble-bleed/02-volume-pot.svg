<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="What the volume pot is"><title>What the volume pot is</title><desc>Left, a volume pot seen from the back with three lugs labelled CW, Wiper and CCW. Right, the same pot as a resistive track with a wiper arrow, the input end on the left and the ground end on the right.</desc><rect width="1200" height="700" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">What the volume pot is</text><rect x="40" y="90" width="520" height="490" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="300" y="124" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The pot from the back</text><g data-pot="Volume" data-view="rear"><circle cx="300" cy="260" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="300" cy="260" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="248" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.IN" cx="256" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="256" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="292" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.W" cx="300" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="300" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="336" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.GND" cx="344" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="344" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="300" y="304" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume</text></g><text x="300" y="410" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CW (left): the input end,</text><text x="300" y="436" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">where the signal comes in</text><text x="300" y="464" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Wiper (center): the output,</text><text x="300" y="490" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">which goes to the amp</text><text x="300" y="518" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CCW (right): the ground end,</text><text x="300" y="544" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">which goes to ground</text><rect x="620" y="90" width="540" height="490" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="890" y="124" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The same pot as a picture</text><polyline points="700,330 730,316 760,344 790,316 820,344 850,316 880,344 910,316 940,344 970,316 1000,344 1030,316 1060,330" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/><circle cx="700" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle cx="1060" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><line x1="880" y1="250" x2="880" y2="304" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><polygon points="880,314 873.0405514542203,299.5928463623572 886.9594485457797,299.5928463623572" fill="#1a1a1a"/><text x="880" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><text x="880" y="228" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">to the amp</text><text x="650" y="392" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Input end</text><text x="650" y="418" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">signal from the pickups</text><text x="1130" y="392" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Ground end</text><text x="1130" y="418" font-size="20" font-weight="400" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">to ground</text><text x="880" y="470" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The track</text><text x="880" y="498" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">A strip of resistive material.</text><text x="880" y="524" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The wiper slides along it as I turn the knob.</text><text x="40" y="630" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">A volume pot is a track with a sliding contact on it, the wiper. The signal comes in at one end and the other end goes to ground.</text><text x="40" y="658" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The wiper hands the amp the share I have chosen: toward the input end is louder, toward the ground end is quieter.</text></svg>