<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="The reactive bleed"><title>The reactive bleed</title><desc>The full volume and tone circuit with the switch set to Reactive. The bleed runs from the volume output through a resistor and capacitor to the switch common, then through the Reactive throw to the tone pot CW end. The tone wiper is on the signal rail BUS. The bleed path is highlighted.</desc><rect width="1200" height="740" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The reactive bleed</text><polyline points="290,400 324,400" fill="none" stroke="#ffb020" stroke-opacity="0.5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline points="344,400 610,400 610,300 670,210 730,210 730,340 790,340" fill="none" stroke="#ffb020" stroke-opacity="0.5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline points="810,340 856,340 856,290 900,290" fill="none" stroke="#ffb020" stroke-opacity="0.5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline data-wire="1" data-net="BUS" points="70,110 800,110" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="190" cy="110" r="6" fill="#1f5fbf"/><circle data-dot="1" cx="490" cy="110" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="BUS" points="800,110 800,390 900,390 900,290" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS" points="490,110 490,210 550,210" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="REACT" points="856,290 856,340 810,340 805,333 800,330 795,333 790,340 730,340 730,210 670,210" fill="none" stroke="#b8860b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="TB-SW" points="610,400 610,300" fill="none" stroke="#d35400" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS" points="190,110 190,370 246,370 246,290" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="OUT" points="290,290 290,510 1100,510" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="290" cy="400" r="6" fill="#c0392b"/><polyline data-wire="1" data-net="OUT" points="290,400 324,400 329,393 334,390 339,393 344,400 380,400" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="TB-MID" points="480,400 510,400" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="TONE-CAP" points="944,290 944,350" fill="none" stroke="#16803c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="GND" points="334,290 334,460 1100,460" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="944" cy="460" r="6" fill="#444444"/><polyline data-wire="1" data-net="GND" points="944,450 944,460" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g data-part="RB"><polyline points="380,400 400,400 406,410 418,390 430,410 442,390 454,410 460,400 480,400" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><circle data-terminal="RB.1" cx="380" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="RB.2" cx="480" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="430" y="374" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">150 kΩ</text></g><g data-part="CB"><line x1="510" y1="400" x2="553" y2="400" stroke="#1a1a1a" stroke-width="3"/><line x1="567" y1="400" x2="610" y2="400" stroke="#1a1a1a" stroke-width="3"/><line x1="553" y1="382" x2="553" y2="418" stroke="#1a1a1a" stroke-width="4"/><line x1="567" y1="382" x2="567" y2="418" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="CB.1" cx="510" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="CB.2" cx="610" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="560" y="374" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">1 nF</text></g><g data-part="C22"><line x1="944" y1="350" x2="944" y2="393" stroke="#1a1a1a" stroke-width="3"/><line x1="944" y1="407" x2="944" y2="450" stroke="#1a1a1a" stroke-width="3"/><line x1="926" y1="393" x2="962" y2="393" stroke="#1a1a1a" stroke-width="4"/><line x1="926" y1="407" x2="962" y2="407" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="C22.HOT" cx="944" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="C22.GND" cx="944" cy="450" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="970" y="405" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">22 nF</text></g><g data-pot="Volume" data-view="rear"><circle cx="290" cy="220" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="290" cy="220" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="238" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.IN" cx="246" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="246" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="282" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.W" cx="290" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="290" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="326" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.GND" cx="334" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="334" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="290" y="264" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume</text></g><g data-pot="Tone" data-view="rear"><circle cx="900" cy="220" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="900" cy="220" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="848" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CW" cx="856" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="856" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="892" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.W" cx="900" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="900" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="936" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CCW" cx="944" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="944" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="900" y="264" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tone</text></g><g data-switch="SW"><line data-blade="1" x1="610" y1="300" x2="670" y2="210" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="550" cy="210" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="550" y="190" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="610" cy="210" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="610" y="190" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Off</text><circle data-terminal="SW.REACTIVE" cx="670" cy="210" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="670" y="190" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="610" cy="300" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="626" y="306" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><circle data-terminal="SEL.C" cx="70" cy="110" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="JACK.SLV" cx="1100" cy="460" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="JACK.TIP" cx="1100" cy="510" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="30" y="84" font-size="18" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Pickup selector</text><text x="1100" y="428" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Output jack</text><text x="1116" y="466" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Sleeve</text><text x="1116" y="516" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tip</text><g data-netlabel="BUS"><rect x="302" y="94" width="56" height="32" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="3"/><text x="330" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#1f5fbf" font-family="Inter, Helvetica, Arial, sans-serif">BUS</text></g><g data-netlabel="OUT"><rect x="972" y="494" width="56" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="1000" y="516" font-size="16" font-weight="700" text-anchor="middle" fill="#c0392b" font-family="Inter, Helvetica, Arial, sans-serif">OUT</text></g><g data-netlabel="GND"><rect x="972" y="444" width="56" height="32" rx="6" fill="#ffffff" stroke="#444444" stroke-width="3"/><text x="1000" y="466" font-size="16" font-weight="700" text-anchor="middle" fill="#444444" font-family="Inter, Helvetica, Arial, sans-serif">GND</text></g><g data-netlabel="REACT"><rect x="692.5" y="254" width="75" height="32" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="3"/><text x="730" y="276" font-size="16" font-weight="700" text-anchor="middle" fill="#b8860b" font-family="Inter, Helvetica, Arial, sans-serif">REACT</text></g><text x="40" y="600" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed takes its signal from the tone pot's spare end. At full tone it acts like an ordinary bleed;</text><text x="40" y="628" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">as I roll the tone back, the signal reaching the bleed fades with it. The glow marks the bleed path.</text><text x="40" y="656" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tone pot from the back: the CW end is the Reactive feed (the wiper reaches it at full tone),</text><text x="40" y="684" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">the wiper rides on the signal rail (BUS), and the CCW end goes through the 22 nF capacitor</text><text x="40" y="712" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">to ground (the wiper reaches it at tone 0).</text></svg>