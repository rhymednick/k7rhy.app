<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="The volume pot with no bleed"><title>The volume pot with no bleed</title><desc>A pickup feeds the input lug of a rear-view volume pot. The wiper goes to the output jack tip and the far lug goes to ground. There is no bleed.</desc><rect width="1200" height="720" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The volume pot with no bleed</text><polyline data-wire="1" data-net="BUS" points="230,170 440,170 440,410 516,410 516,330" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="OUT" points="560,330 560,470 980,470" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="GND" points="604,330 604,420 980,420" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="GND" points="145,210 145,600 1030,600 1030,420 980,420" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="60" y="130" width="170" height="80" rx="14" fill="#f6ecd6" stroke="#1a1a1a" stroke-width="3"/><text x="145" y="178" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Pickup</text><g data-pot="Volume" data-view="rear"><circle cx="560" cy="260" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="560" cy="260" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="508" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.IN" cx="516" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="516" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="552" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.W" cx="560" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="560" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="596" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.GND" cx="604" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="604" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="560" y="304" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume</text></g><circle data-terminal="JACK.SLV" cx="980" cy="420" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="JACK.TIP" cx="980" cy="470" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="1052" y="426" font-size="18" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Sleeve (ground)</text><text x="1052" y="476" font-size="18" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tip (to the amp)</text><text x="980" y="392" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Output jack</text><g data-netlabel="BUS"><rect x="312" y="154" width="56" height="32" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="3"/><text x="340" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#1f5fbf" font-family="Inter, Helvetica, Arial, sans-serif">BUS</text></g><g data-netlabel="OUT"><rect x="772" y="454" width="56" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="800" y="476" font-size="16" font-weight="700" text-anchor="middle" fill="#c0392b" font-family="Inter, Helvetica, Arial, sans-serif">OUT</text></g><g data-netlabel="GND"><rect x="772" y="404" width="56" height="32" rx="6" fill="#ffffff" stroke="#444444" stroke-width="3"/><text x="800" y="426" font-size="16" font-weight="700" text-anchor="middle" fill="#444444" font-family="Inter, Helvetica, Arial, sans-serif">GND</text></g><text x="40" y="650" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The signal comes in at one end of the pot. The wiper takes the part I've asked for and sends it to the jack.</text><text x="40" y="678" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The other end goes to ground. Blue is the signal in, red is the signal out, gray is ground.</text></svg>