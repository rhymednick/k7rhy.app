<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="How a bleed changes the sound as I turn down"><title>How a bleed changes the sound as I turn down</title><desc>A hand-drawn style sketch with no numbers. The horizontal axis is volume knob position from turned down to full up and the vertical axis is brightness from duller to brighter. Three curves, no bleed, reactive bleed and fixed bleed, all meet at full volume. The no bleed curve is lowest at low volume, the fixed bleed curve is highest and the reactive bleed curve sits between. The drawing is labelled Illustration, not a measurement.</desc><rect width="1200" height="730" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">How a bleed changes the sound as I turn down</text><text x="40" y="92" font-size="24" font-weight="700" text-anchor="start" fill="#e8590c" font-family="Inter, Helvetica, Arial, sans-serif">Illustration, not a measurement</text><line x1="160" y1="520" x2="980" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/><polygon points="990,520 975.5928463623571,526.9594485457797 975.5928463623571,513.0405514542203" fill="#1a1a1a"/><line x1="160" y1="520" x2="160" y2="140" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/><polygon points="160,130 166.95944854577968,144.40715363764284 153.04055145422032,144.40715363764284" fill="#1a1a1a"/><path d="M160,500 C520,495 780,420 960,170" fill="none" stroke="#4a5560" stroke-width="6" stroke-linecap="round"/><text x="562.1617600000001" y="482.8767600000001" font-size="22" font-weight="700" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">No bleed</text><path d="M160,415 C470,395 760,320 960,170" fill="none" stroke="#16803c" stroke-width="6" stroke-linecap="round"/><text x="559.97125" y="398.76500000000004" font-size="22" font-weight="700" text-anchor="middle" fill="#16803c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive bleed</text><path d="M160,330 C420,300 740,230 960,170" fill="none" stroke="#e8590c" stroke-width="6" stroke-linecap="round"/><text x="507.4979200000001" y="256.73640000000006" font-size="22" font-weight="700" text-anchor="middle" fill="#e8590c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Fixed bleed</text><text x="160" y="556" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Turned down</text><text x="575" y="556" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume knob position</text><text x="990" y="556" font-size="20" font-weight="400" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Full up</text><text x="146" y="150" font-size="20" font-weight="400" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Brighter</text><text x="146" y="524" font-size="20" font-weight="400" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Duller</text><text x="52" y="337" font-size="20" font-weight="700" text-anchor="middle" transform="rotate(-90 52 337)" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1a1a1a">Brightness</text><text x="40" y="610" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Without a bleed, the highs fade fast as I turn the volume down.</text><text x="40" y="638" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">A fixed bleed keeps more of them, but it behaves the same wherever the tone knob is.</text><text x="40" y="666" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">A reactive bleed keeps the highs too, and then follows the tone knob: roll the tone back and the bleed eases off.</text><text x="40" y="694" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The shapes only show the idea.</text></svg>