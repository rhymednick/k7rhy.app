<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="Finding a pot's wiper and ends"><title>Finding a pot's wiper and ends</title><desc>A tone pot seen from the back with its three lugs labelled CW, Wiper and CCW, a key saying what each lug does, and three numbered meter steps: find the wiper, find the CW end, check the other end.</desc><rect width="1200" height="790" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Finding a pot's wiper and ends</text><rect x="40" y="100" width="480" height="520" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><g data-pot="Tone" data-view="rear"><circle cx="280" cy="200" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="280" cy="200" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="228" y="262" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CW" cx="236" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="236" y="306" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="272" y="262" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.W" cx="280" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="280" y="306" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="316" y="262" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CCW" cx="324" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="324" y="306" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="280" y="244" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tone</text></g><text x="70" y="380" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CW end</text><text x="70" y="406" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The wiper reaches it at full tone.</text><text x="70" y="428" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">It feeds the bleed (the Reactive feed).</text><text x="70" y="456" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><text x="70" y="482" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Always the middle lug,</text><text x="70" y="504" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">seen from the back.</text><text x="70" y="532" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CCW end</text><text x="70" y="558" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The wiper reaches it at tone 0.</text><text x="70" y="580" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">It goes to the 22 nF capacitor.</text><rect x="560" y="100" width="600" height="170" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><circle cx="596" cy="136" r="17" fill="#e8590c"/><text x="596" y="143" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">1</text><text x="626" y="144" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Find the wiper</text><text x="590" y="176" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Read with the pot not wired in (out of the circuit).</text><text x="590" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Set the meter to ohms, knob near the middle, and read</text><text x="590" y="228" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">each pair of lugs. The highest pair is the two ends;</text><text x="590" y="254" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">the lug left over is the wiper.</text><rect x="560" y="290" width="600" height="170" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><circle cx="596" cy="326" r="17" fill="#e8590c"/><text x="596" y="333" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">2</text><text x="626" y="334" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Find the CW end</text><text x="590" y="366" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Turn the knob fully clockwise (tone 10, from the front).</text><text x="590" y="392" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Read the wiper to each end. The end that reads close to</text><text x="590" y="418" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">zero is the CW end, which will feed the bleed.</text><rect x="560" y="480" width="600" height="170" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><circle cx="596" cy="516" r="17" fill="#e8590c"/><text x="596" y="523" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">3</text><text x="626" y="524" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Check the other end</text><text x="590" y="556" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The wiper to the other end now reads the full value.</text><text x="590" y="582" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">That is the CCW end, the one that goes to the capacitor.</text><text x="590" y="608" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Turn the knob fully back and the two readings swap.</text><text x="40" y="695" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Makers number pot lugs differently, so I name them by what they do and find them with a meter.</text><text x="40" y="723" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Seen from the back with the shaft pointing away and the lugs down, left, center and right are CW, wiper and CCW.</text><text x="40" y="751" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The same test works for the volume pot: its CW end is the input and its CCW end goes to ground.</text></svg>