<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Three common treble bleeds"><title>Three common treble bleeds</title><desc>Three small volume-pot schematics side by side. Each has a capacitor from the pot input to its wiper. The first is the capacitor alone, the second adds a resistor in parallel with the capacitor, and the third adds a resistor in series with it.</desc><rect width="1200" height="760" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Three common treble bleeds</text><rect x="20" y="100" width="376" height="530" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="208" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Capacitor only</text><text x="26" y="664" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Highs skip past the pot at every</text><text x="26" y="692" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">volume, so the sound stays bright</text><text x="26" y="720" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">as I turn down.</text><text x="70" y="170" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">From pickup</text><text x="340" y="170" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">To jack</text><rect x="412" y="100" width="376" height="530" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="600" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">With a parallel resistor</text><text x="418" y="664" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The resistor lets some of the lows</text><text x="418" y="692" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">through too, so the sound stays</text><text x="418" y="720" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">fuller as I turn down.</text><text x="462" y="170" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">From pickup</text><text x="732" y="170" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">To jack</text><rect x="804" y="100" width="376" height="530" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="992" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">With a series resistor</text><text x="810" y="664" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The resistor trims how much of the</text><text x="810" y="692" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">highs skip past. Lipstick uses</text><text x="810" y="720" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">this kind.</text><text x="854" y="170" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">From pickup</text><text x="1124" y="170" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">To jack</text><polyline data-wire="1" data-net="GND1" points="254,330 254,390" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="236" y1="396" x2="272" y2="396" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="242" y1="403" x2="266" y2="403" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="248" y1="410" x2="260" y2="410" stroke="#444444" stroke-width="4" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS1" points="166,330 166,390 70,390" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="70" cy="390" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="OUT1" points="210,330 210,450 340,450" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="340" cy="450" r="6" fill="#c0392b"/><polyline data-wire="1" data-net="BUS1" points="70,186 70,530 155,530" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="OUT1" points="340,186 340,530 255,530" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g data-part="P1.C"><line x1="155" y1="530" x2="198" y2="530" stroke="#1a1a1a" stroke-width="3"/><line x1="212" y1="530" x2="255" y2="530" stroke="#1a1a1a" stroke-width="3"/><line x1="198" y1="512" x2="198" y2="548" stroke="#1a1a1a" stroke-width="4"/><line x1="212" y1="512" x2="212" y2="548" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="P1.C.1" cx="155" cy="530" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="P1.C.2" cx="255" cy="530" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="205" y="504" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Capacitor</text></g><g data-pot="Volume" data-view="rear"><circle cx="210" cy="260" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="210" cy="260" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="158" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P1.IN" cx="166" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="166" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="202" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P1.W" cx="210" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="246" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P1.GND" cx="254" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="254" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="210" y="304" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume</text></g><polyline data-wire="1" data-net="GND2" points="646,330 646,390" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="628" y1="396" x2="664" y2="396" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="634" y1="403" x2="658" y2="403" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="640" y1="410" x2="652" y2="410" stroke="#444444" stroke-width="4" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS2" points="558,330 558,390 462,390" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="462" cy="390" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="OUT2" points="602,330 602,450 732,450" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="732" cy="450" r="6" fill="#c0392b"/><polyline data-wire="1" data-net="BUS2" points="462,186 462,580 547,580" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS2" points="462,510 547,510" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="462" cy="510" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="OUT2" points="732,186 732,580 647,580" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="OUT2" points="732,510 647,510" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="732" cy="510" r="6" fill="#c0392b"/><g data-part="P2.C"><line x1="547" y1="510" x2="590" y2="510" stroke="#1a1a1a" stroke-width="3"/><line x1="604" y1="510" x2="647" y2="510" stroke="#1a1a1a" stroke-width="3"/><line x1="590" y1="492" x2="590" y2="528" stroke="#1a1a1a" stroke-width="4"/><line x1="604" y1="492" x2="604" y2="528" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="P2.C.1" cx="547" cy="510" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="P2.C.2" cx="647" cy="510" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="597" y="484" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Capacitor</text></g><g data-part="P2.R"><polyline points="547,580 567,580 573,590 585,570 597,590 609,570 621,590 627,580 647,580" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><circle data-terminal="P2.R.1" cx="547" cy="580" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="P2.R.2" cx="647" cy="580" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="597" y="554" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Resistor</text></g><g data-pot="Volume" data-view="rear"><circle cx="602" cy="260" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="602" cy="260" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="550" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P2.IN" cx="558" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="558" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="594" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P2.W" cx="602" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="602" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="638" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P2.GND" cx="646" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="646" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="602" y="304" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume</text></g><polyline data-wire="1" data-net="GND3" points="1038,330 1038,390" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="1020" y1="396" x2="1056" y2="396" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="1026" y1="403" x2="1050" y2="403" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="1032" y1="410" x2="1044" y2="410" stroke="#444444" stroke-width="4" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS3" points="950,330 950,390 854,390" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="854" cy="390" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="OUT3" points="994,330 994,450 1124,450" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="1124" cy="450" r="6" fill="#c0392b"/><polyline data-wire="1" data-net="BUS3" points="854,186 854,530 869,530" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="MID3" points="969,530 1019,530" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="OUT3" points="1124,186 1124,530 1119,530" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g data-part="P3.C"><line x1="869" y1="530" x2="912" y2="530" stroke="#1a1a1a" stroke-width="3"/><line x1="926" y1="530" x2="969" y2="530" stroke="#1a1a1a" stroke-width="3"/><line x1="912" y1="512" x2="912" y2="548" stroke="#1a1a1a" stroke-width="4"/><line x1="926" y1="512" x2="926" y2="548" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="P3.C.1" cx="869" cy="530" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="P3.C.2" cx="969" cy="530" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="919" y="504" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Capacitor</text></g><g data-part="P3.R"><polyline points="1019,530 1039,530 1045,540 1057,520 1069,540 1081,520 1093,540 1099,530 1119,530" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><circle data-terminal="P3.R.1" cx="1019" cy="530" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="P3.R.2" cx="1119" cy="530" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="1069" y="504" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Resistor</text></g><g data-pot="Volume" data-view="rear"><circle cx="994" cy="260" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="994" cy="260" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="942" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P3.IN" cx="950" cy="330" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="950" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="986" y="322" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="P3.W" cx=