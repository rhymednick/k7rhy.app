<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="The switch's three positions"><title>The switch's three positions</title><desc>Three small switch drawings: Direct, Off and Reactive. Each shows the lever from the common to the throw it touches. In Off the lever touches no lug.</desc><rect width="1200" height="680" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The switch's three positions</text><rect x="20" y="100" width="376" height="390" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="208" y="138" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><g data-switch="SW"><line data-blade="1" x1="208" y1="360" x2="148" y2="270" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="148" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="148" y="250" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="208" cy="270" r="9" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/><text x="208" y="196" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Rest position,</text><text x="208" y="216" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">no lug</text><circle data-terminal="SW.REACTIVE" cx="268" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="268" y="250" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="208" cy="360" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="224" y="366" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><text x="208" y="410" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Common is joined to the Direct lug.</text><text x="208" y="438" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed goes straight to the</text><text x="208" y="466" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">main signal wire.</text><rect x="412" y="100" width="376" height="390" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="600" y="138" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Off</text><g data-switch="SW"><line data-blade="1" x1="600" y1="360" x2="600" y2="270" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="540" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="540" y="250" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="600" cy="270" r="9" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/><text x="600" y="196" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Rest position,</text><text x="600" y="216" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">no lug</text><circle data-terminal="SW.REACTIVE" cx="660" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="660" y="250" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="600" cy="360" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="616" y="366" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><text x="600" y="410" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The lever rests in the middle,</text><text x="600" y="438" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">on no lug.</text><text x="600" y="466" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed is disconnected.</text><rect x="804" y="100" width="376" height="390" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="992" y="138" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><g data-switch="SW"><line data-blade="1" x1="992" y1="360" x2="1052" y2="270" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="932" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="932" y="250" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="992" cy="270" r="9" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/><text x="992" y="196" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Rest position,</text><text x="992" y="216" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">no lug</text><circle data-terminal="SW.REACTIVE" cx="1052" cy="270" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="1052" y="250" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="992" cy="360" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="1008" y="366" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><text x="992" y="410" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Common is joined to the Reactive lug.</text><text x="992" y="438" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed is fed from the tone pot's</text><text x="992" y="466" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CW end.</text><text x="40" y="540" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The switch has three lugs: Common and two ends. The middle is a rest position, not a lug.</text><text x="40" y="576" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">This is the idea, not a lug layout. Switches put the common on different lugs, so confirm with a meter:</text><text x="40" y="604" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">set it to continuity, flip to each position and note which lugs beep. The common is the lug that beeps</text><text x="40" y="632" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">with one end lug in one position and with the other end lug in the other. In the middle nothing beeps.</text></svg>