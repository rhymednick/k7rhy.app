<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The switch's three positions"><title>The switch's three positions</title><desc>Three small switch drawings: Direct, Off and Reactive. Each shows the lever from the common to the throw it touches. In Off the lever touches no lug.</desc><rect width="1200" height="630" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The switch's three positions</text><rect x="20" y="100" width="376" height="390" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="208" y="138" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><text x="208" y="178" font-size="16" font-weight="400" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">The middle spot is a rest position</text><text x="208" y="198" font-size="16" font-weight="400" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">with no lug of its own</text><g data-switch="SW"><line data-blade="1" x1="208" y1="350" x2="148" y2="260" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="148" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="148" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="208" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="208" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Off</text><circle data-terminal="SW.REACTIVE" cx="268" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="268" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="208" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="224" y="356" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><text x="208" y="410" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Common is joined to the Direct lug.</text><text x="208" y="438" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed goes straight to the</text><text x="208" y="466" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">main signal wire.</text><rect x="412" y="100" width="376" height="390" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="600" y="138" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Off</text><text x="600" y="178" font-size="16" font-weight="400" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">The middle spot is a rest position</text><text x="600" y="198" font-size="16" font-weight="400" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">with no lug of its own</text><g data-switch="SW"><line data-blade="1" x1="600" y1="350" x2="600" y2="260" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="540" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="540" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="600" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="600" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Off</text><circle data-terminal="SW.REACTIVE" cx="660" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="660" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="600" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="616" y="356" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><text x="600" y="410" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The lever rests in the middle</text><text x="600" y="438" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">and touches no lug.</text><text x="600" y="466" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed is disconnected.</text><rect x="804" y="100" width="376" height="390" rx="14" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/><text x="992" y="138" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><text x="992" y="178" font-size="16" font-weight="400" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">The middle spot is a rest position</text><text x="992" y="198" font-size="16" font-weight="400" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">with no lug of its own</text><g data-switch="SW"><line data-blade="1" x1="992" y1="350" x2="1052" y2="260" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/><circle data-terminal="SW.DIRECT" cx="932" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="932" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Direct</text><circle data-terminal="SW.OFF" cx="992" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="992" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Off</text><circle data-terminal="SW.REACTIVE" cx="1052" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="1052" y="240" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Reactive</text><circle data-terminal="SW.C" cx="992" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="1008" y="356" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Common</text></g><text x="992" y="410" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Common is joined to the Reactive lug.</text><text x="992" y="438" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed is fed from the tone pot's</text><text x="992" y="466" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CW end.</text><text x="40" y="540" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">This is the idea, not a lug layout. Switches put the common on different lugs, so confirm with a meter:</text><text x="40" y="568" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">set it to continuity, flip to each position and note which lugs beep.</text><text x="40" y="596" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The lug that beeps with each end lug, one in each end position, is the common. In the middle position nothing beeps.</text></svg>