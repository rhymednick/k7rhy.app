<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="The signal chain"><title>The signal chain</title><desc>Four labelled boxes joined by arrows: Pickup, Volume pot, Cable, Amp. Under each box is one line about its job.</desc><rect width="1200" height="480" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The signal chain</text><rect x="40" y="140" width="230" height="110" rx="16" fill="#f6ecd6" stroke="#1a1a1a" stroke-width="3"/><text x="155" y="205" font-size="28" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Pickup</text><line x1="278" y1="195" x2="318" y2="195" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round"/><polygon points="328,195 313.5928463623572,201.95944854577968 313.5928463623572,188.04055145422032" fill="#1f5fbf"/><text x="155" y="292" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Turns string motion</text><text x="155" y="318" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">into a tiny electrical</text><text x="155" y="344" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">signal.</text><rect x="336" y="140" width="230" height="110" rx="16" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><text x="451" y="205" font-size="28" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume pot</text><line x1="574" y1="195" x2="614" y2="195" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round"/><polygon points="624,195 609.5928463623571,201.95944854577968 609.5928463623571,188.04055145422032" fill="#1f5fbf"/><text x="451" y="292" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Lets through as much</text><text x="451" y="318" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">of that signal as</text><text x="451" y="344" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">I ask for.</text><rect x="632" y="140" width="230" height="110" rx="16" fill="#e3f0e6" stroke="#1a1a1a" stroke-width="3"/><text x="747" y="205" font-size="28" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Cable</text><line x1="870" y1="195" x2="910" y2="195" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round"/><polygon points="920,195 905.5928463623571,201.95944854577968 905.5928463623571,188.04055145422032" fill="#1f5fbf"/><text x="747" y="292" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Carries the signal</text><text x="747" y="318" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">to the amp.</text><rect x="928" y="140" width="230" height="110" rx="16" fill="#f6e3e0" stroke="#1a1a1a" stroke-width="3"/><text x="1043" y="205" font-size="28" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Amp</text><text x="1043" y="292" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Makes it loud</text><text x="1043" y="318" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">enough to hear.</text><text x="40" y="410" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The signal runs one way: from the pickup, through the volume pot, along the cable and into the amp.</text><text x="40" y="438" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Everything on the next pages happens in two places: the volume pot and the cable.</text></svg>