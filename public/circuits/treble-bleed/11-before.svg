<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Before: Lipstick's volume and tone as they are now"><title>Before: Lipstick's volume and tone as they are now</title><desc>The stock Lipstick volume and tone circuit. The signal rail BUS feeds the volume pot input and the tone pot CCW end. The tone wiper goes to a 22 nF capacitor to ground. The tone CW end is unused. A fixed series capacitor and resistor bleed runs from BUS to the volume output. The wires that change in the retrofit are highlighted.</desc><rect width="1200" height="700" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Before: Lipstick's volume and tone as they are now</text><polyline points="1010,110 1010,340 944,340 944,290" fill="none" stroke="#e8590c" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline points="900,290 900,450" fill="none" stroke="#e8590c" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline points="610,400 610,110" fill="none" stroke="#e8590c" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline data-wire="1" data-net="BUS" points="70,110 1010,110 1010,340 944,340 944,290" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="190" cy="110" r="6" fill="#1f5fbf"/><circle data-dot="1" cx="610" cy="110" r="6" fill="#1f5fbf"/><polyline data-wire="1" data-net="BUS" points="610,400 610,110" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS" points="190,110 190,370 246,370 246,290" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="OUT" points="290,290 290,510 1100,510" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="290" cy="400" r="6" fill="#c0392b"/><polyline data-wire="1" data-net="OUT" points="290,400 324,400 329,393 334,390 339,393 344,400 380,400" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="TB-MID" points="480,400 510,400" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="TONE-CAP" points="900,290 900,350" fill="none" stroke="#16803c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="GND" points="334,290 334,460 1100,460" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle data-dot="1" cx="900" cy="460" r="6" fill="#444444"/><polyline data-wire="1" data-net="GND" points="900,450 900,460" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g data-part="RB"><polyline points="380,400 400,400 406,410 418,390 430,410 442,390 454,410 460,400 480,400" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><circle data-terminal="RB.1" cx="380" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="RB.2" cx="480" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="430" y="374" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">150 kΩ</text></g><g data-part="CB"><line x1="510" y1="400" x2="553" y2="400" stroke="#1a1a1a" stroke-width="3"/><line x1="567" y1="400" x2="610" y2="400" stroke="#1a1a1a" stroke-width="3"/><line x1="553" y1="382" x2="553" y2="418" stroke="#1a1a1a" stroke-width="4"/><line x1="567" y1="382" x2="567" y2="418" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="CB.1" cx="510" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="CB.2" cx="610" cy="400" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="560" y="374" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">1 nF</text></g><g data-part="C22"><line x1="900" y1="350" x2="900" y2="393" stroke="#1a1a1a" stroke-width="3"/><line x1="900" y1="407" x2="900" y2="450" stroke="#1a1a1a" stroke-width="3"/><line x1="882" y1="393" x2="918" y2="393" stroke="#1a1a1a" stroke-width="4"/><line x1="882" y1="407" x2="918" y2="407" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="C22.HOT" cx="900" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="C22.GND" cx="900" cy="450" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="926" y="405" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">22 nF</text></g><g data-pot="Volume" data-view="rear"><circle cx="290" cy="220" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="290" cy="220" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="238" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.IN" cx="246" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="246" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="282" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.W" cx="290" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="290" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="326" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="VOL.GND" cx="334" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="334" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="290" y="264" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Volume</text></g><g data-pot="Tone" data-view="rear"><circle cx="900" cy="220" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="900" cy="220" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="848" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CW" cx="856" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="856" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="892" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.W" cx="900" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="900" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="936" y="282" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CCW" cx="944" cy="290" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="944" y="326" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="900" y="264" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tone</text></g><circle data-terminal="SEL.C" cx="70" cy="110" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="JACK.SLV" cx="1100" cy="460" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="JACK.TIP" cx="1100" cy="510" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="30" y="84" font-size="18" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Pickup selector</text><text x="1100" y="428" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Output jack</text><text x="1116" y="466" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Sleeve</text><text x="1116" y="516" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tip</text><text x="856" y="362" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5560" font-family="Inter, Helvetica, Arial, sans-serif">not used</text><g data-netlabel="BUS"><rect x="302" y="94" width="56" height="32" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="3"/><text x="330" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#1f5fbf" font-family="Inter, Helvetica, Arial, sans-serif">BUS</text></g><g data-netlabel="OUT"><rect x="972" y="494" width="56" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="1000" y="516" font-size="16" font-weight="700" text-anchor="middle" fill="#c0392b" font-family="Inter, Helvetica, Arial, sans-serif">OUT</text></g><g data-netlabel="GND"><rect x="972" y="444" width="56" height="32" rx="6" fill="#ffffff" stroke="#444444" stroke-width="3"/><text x="1000" y="466" font-size="16" font-weight="700" text-anchor="middle" fill="#444444" font-family="Inter, Helvetica, Arial, sans-serif">GND</text></g><circle cx="1010" cy="225" r="17" fill="#e8590c"/><text x="1010" y="232" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">1</text><circle cx="850" cy="410" r="17" fill="#e8590c"/><text x="850" y="417" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">2</text><circle cx="800" cy="325" r="17" fill="#e8590c"/><text x="800" y="332" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">3</text><circle cx="610" cy="230" r="17" fill="#e8590c"/><text x="610" y="237" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif">4</text><text x="40" y="600" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The signal reaches the tone pot at its CCW end, the wiper goes to the 22 nF capacitor, and the CW end isn't used.</text><text x="40" y="628" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The bleed runs from the signal rail to the output. Orange marks what the retrofit changes.</text></svg>