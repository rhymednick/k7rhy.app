<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="The tone pot's three lugs"><title>The tone pot's three lugs</title><desc>A tone pot seen from the back. The wiper lug goes to the pickup selector on the main signal wire. The CCW lug goes through a 22 nF capacitor to ground. The CW lug goes to the Reactive lug of the switch.</desc><rect width="1200" height="730" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The tone pot's three lugs</text><polyline data-wire="1" data-net="REACT" points="556,260 556,380 240,380" fill="none" stroke="#8a6508" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="BUS" points="600,260 600,520" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="TONE-CAP" points="644,260 644,320 850,320 850,350" fill="none" stroke="#16803c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline data-wire="1" data-net="GND" points="850,450 850,490" fill="none" stroke="#444444" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g data-pot="Tone" data-view="rear"><circle cx="600" cy="190" r="64" fill="#e8ecf0" stroke="#1a1a1a" stroke-width="3"/><circle cx="600" cy="190" r="20" fill="#c9d1d9" stroke="#1a1a1a" stroke-width="2"/><rect x="548" y="252" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CW" cx="556" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="556" y="296" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW</text><rect x="592" y="252" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.W" cx="600" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="600" y="296" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">Wiper</text><rect x="636" y="252" width="16" height="20" fill="#d4d4d4" stroke="#1a1a1a" stroke-width="2"/><circle data-terminal="TONE.CCW" cx="644" cy="260" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="644" y="296" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CCW</text><text x="600" y="234" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Tone</text></g><circle data-terminal="SW.REACTIVE" cx="240" cy="380" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="SEL.C" cx="600" cy="520" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><g data-part="C22"><line x1="850" y1="350" x2="850" y2="393" stroke="#1a1a1a" stroke-width="3"/><line x1="850" y1="407" x2="850" y2="450" stroke="#1a1a1a" stroke-width="3"/><line x1="832" y1="393" x2="868" y2="393" stroke="#1a1a1a" stroke-width="4"/><line x1="832" y1="407" x2="868" y2="407" stroke="#1a1a1a" stroke-width="4"/><circle data-terminal="C22.HOT" cx="850" cy="350" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><circle data-terminal="C22.GND" cx="850" cy="450" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="876" y="405" font-size="16" font-weight="600" text-anchor="start" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">22 nF</text></g><line x1="832" y1="496" x2="868" y2="496" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="838" y1="503" x2="862" y2="503" stroke="#444444" stroke-width="4" stroke-linecap="round"/><line x1="844" y1="510" x2="856" y2="510" stroke="#444444" stroke-width="4" stroke-linecap="round"/><g data-netlabel="REACT"><rect x="292.5" y="364" width="75" height="32" rx="6" fill="#ffffff" stroke="#8a6508" stroke-width="3"/><text x="330" y="386" font-size="16" font-weight="700" text-anchor="middle" fill="#8a6508" font-family="Inter, Helvetica, Arial, sans-serif">REACT</text></g><g data-netlabel="BUS"><rect x="572" y="424" width="56" height="32" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="3"/><text x="600" y="446" font-size="16" font-weight="700" text-anchor="middle" fill="#1f5fbf" font-family="Inter, Helvetica, Arial, sans-serif">BUS</text></g><text x="520" y="290" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">CW end: the Reactive feed</text><text x="520" y="318" font-size="18" font-weight="400" text-anchor="end" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">The wiper reaches it at full tone.</text><text x="520" y="342" font-size="18" font-weight="400" text-anchor="end" fill="#1a1a1a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-family="Inter, Helvetica, Arial, sans-serif">It goes to the switch's Reactive lug.</text><text x="240" y="420" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Switch's Reactive lug</text><text x="240" y="446" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">(leads on to the bleed)</text><text x="570" y="480" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Wiper: rides on the main</text><text x="570" y="506" font-size="20" font-weight="400" text-anchor="end" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">signal wire from the pickups.</text><text x="600" y="556" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">From the pickups</text><text x="890" y="250" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">CCW end: goes through the</text><text x="890" y="276" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">22 nF capacitor to ground.</text><text x="890" y="300" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The wiper reaches it at tone 0.</text><text x="40" y="610" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">Seen from the back, with the shaft pointing away. The wiper rides on the main signal wire from the pickups.</text><text x="40" y="638" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The CCW end goes through the capacitor to ground.</text><text x="40" y="666" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The CW end goes to the Reactive lug of the switch, and from there to the bleed.</text><text x="40" y="694" font-size="20" font-weight="400" text-anchor="start" fill="#1a1a1a" font-family="Inter, Helvetica, Arial, sans-serif">The colored tags name the wires: BUS is the main signal wire from the pickups, and REACT is the wire to the Reactive lug.</text></svg>