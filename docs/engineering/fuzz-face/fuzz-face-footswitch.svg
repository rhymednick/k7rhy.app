<text x="1080.0" y="624" font-size="12" text-anchor="middle" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">GND (sleeve)</text>
<text x="1138" y="495" font-size="12" text-anchor="end" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">sleeve</text>
<circle cx="470" cy="810" r="24" fill="#ff5252" stroke="#b71c1c" stroke-width="2"/>
<line x1="446" y1="788" x2="494" y2="788" stroke="#b71c1c" stroke-width="3"/>
<text x="508" y="792" font-size="13" text-anchor="start" fill="#e67e22" font-weight="bold" font-family="Helvetica, Arial, sans-serif">LED cathode (−): short leg, flat edge</text>
<text x="508" y="840" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold" font-family="Helvetica, Arial, sans-serif">LED anode (+): long leg</text>
<polyline points="470,834 470,880 560,880" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="560" y="868" width="90" height="24" rx="10" fill="#e8d3a8" stroke="#a1887f"/>
<rect x="578" y="868" width="8" height="24" fill="#f9a825"/>
<rect x="594" y="868" width="8" height="24" fill="#6a1b9a"/>
<rect x="610" y="868" width="8" height="24" fill="#d32f2f"/>
<text x="605" y="915" font-size="13" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">R5 4.7k</text>
<polyline points="650,880 760,880" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="850" width="150" height="58" rx="8" fill="#f4efe2" stroke="#a8956a" stroke-width="1.5"/>
<text x="835.0" y="874" font-size="15" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Board A12</text>
<text x="835.0" y="894" font-size="12" text-anchor="middle" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+9 V</text>
<text x="470" y="948" font-size="13" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">LED on leads, mounted through the case (5 mm LED + bezel)</text>
<text x="1290" y="110" font-size="17" text-anchor="start" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">What the switch does</text>
<text x="1290" y="140" font-size="15" text-anchor="start" fill="#1b5e20" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Effect ON</text>
<text x="1302" y="162" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">J1 tip → board INPUT (B11)</text>
<text x="1302" y="182" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">VOLUME lug 2 → J2 tip</text>
<text x="1302" y="202" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">LED cathode → GND: LED lit</text>
<text x="1290" y="232" font-size="15" text-anchor="start" fill="#4a148c" font-weight="bold" font-family="Helvetica, Arial, sans-serif">BYPASS</text>
<text x="1302" y="254" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">J1 tip → jumper 8–9 → J2 tip</text>
<text x="1302" y="274" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Board input and output open</text>
<text x="1302" y="294" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">LED off</text>
<text x="1290" y="334" font-size="17" text-anchor="start" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Which row is ON?</text>
<text x="1290" y="360" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">It doesn’t matter. Each click swaps the</text>
<text x="1290" y="379" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">commons (middle row) between the top and</text>
<text x="1290" y="398" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">bottom rows, so one click is effect ON and</text>
<text x="1290" y="417" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the next is BYPASS. The LED shows which.</text>
<text x="1290" y="436" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif"></text>
<text x="1290" y="455" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">What matters: wire exactly the lugs shown.</text>
<text x="1290" y="474" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Check first with a meter on continuity:</text>
<text x="1290" y="493" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">each middle lug beeps to one outer lug</text>
<text x="1290" y="512" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">in its own column, never to another column.</text>
<text x="1290" y="531" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif"></text>
<text x="1290" y="550" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">The 1M pulldown (RPD) on the board</text>
<text x="1290" y="569" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">keeps INPUT from floating in bypass,</text>
<text x="1290" y="588" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">which prevents switching pops.</text>
<text x="1290" y="607" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif"></text>
<text x="1290" y="626" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Ground the foil shield with a wire to any</text>
<text x="1290" y="645" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">free hole in board row H; keep switch</text>
<text x="1290" y="664" font-size="13" text-anchor="start" fill="#111" font-weight="normal" font-family="Helvetica, Arial, sans-serif">lugs off the foil.</text>
</svg>