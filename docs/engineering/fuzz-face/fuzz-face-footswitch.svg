<text x="95" y="318" font-size="15" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">J1 INPUT</text>
<text x="95" y="334" font-size="11" text-anchor="middle" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">stereo (TRS) jack</text>
<circle cx="150" cy="395" r="7" fill="#f5d76e"/>
<text x="162" y="385" font-size="12" text-anchor="start" fill="#27ae60" font-weight="bold" font-family="Helvetica, Arial, sans-serif">tip</text>
