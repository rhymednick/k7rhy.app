<text x="40" y="68" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Switch drawn from the lug (back) side. Board hole names match the stripboard layout. Both switch positions auto-checked.</text>
