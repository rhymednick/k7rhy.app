<text x="66" y="522" font-size="12" text-anchor="end" fill="#c0392b" font-weight="bold" font-family="Helvetica, Arial, sans-serif">ring</text>
<circle cx="120" cy="500" r="7" fill="#bbb"/>
<text x="130" y="522" font-size="12" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">sleeve</text>
<polyline points="120,500 120,540 170,540 170,580" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="100" y="580" width="140" height="58" rx="8" fill="#f4efe2" stroke="#a8956a" stroke-width="1.5"/>
<text x="170.0" y="604" font-size="15" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Board C8</text>
<text x="170.0" y="624" font-size="12" text-anchor="middle" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">GND (sleeve)</text>
<polyline points="75,500 75,760" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<rect x="40" y="760" width="170" height="64" rx="8" fill="#333"/>
<text x="125" y="800" font-size="14" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">9 V battery</text>
<text x="62" y="752" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">−</text>
<polyline points="210,792 260,792" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="260" y="764" width="140" height="58" rx="8" fill="#f4efe2" stroke="#a8956a" stroke-width="1.5"/>
<text x="330.0" y="788" font-size="15" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Board A10</text>
<text x="330.0" y="808" font-size="12" text-anchor="middle" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">BAT +</text>
<text x="40" y="860" font-size="12" text-anchor="start" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Battery − goes to the jack ring only.</text>
<text x="40" y="878" font-size="12" text-anchor="start" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">A plugged-in mono cable links ring to sleeve,</text>
<text x="40" y="896" font-size="12" text-anchor="start" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">which switches the pedal on. Unplug the input</text>
<text x="40" y="914" font-size="12" text-anchor="start" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">cable to save the battery.</text>
<rect x="1150" y="400" width="110" height="130" rx="10" fill="#555"/>
<text x="1205" y="390" font-size="15" text-anchor="middle" fill="#111" font-weight="bold" font-family="Helvetica, Arial, sans-serif">J2 OUTPUT</text>
<circle cx="1150" cy="450" r="7" fill="#f5d76e"/>
<text x="1138" y="440" font-size="12" text-anchor="end" fill="#2471a3" font-weight="bold" font-family="Helvetica, Arial, sans-serif">tip</text>
<circle cx="1150" cy="500" r="7" fill="#bbb"/>
<polyline points="1150,500 1080,500 1080,580" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1010" y="580" width="140" height="58" rx="8" fill="#f4efe2" stroke="#a8956a" stroke-width="1.5"/>
