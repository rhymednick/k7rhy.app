[build]
    command = "npm run build"
    publish = ".next"
    # Skip the build when every change since the last build is under docs/ (the site does not read it).
    # Builds anyway on a branch's first deploy, or if git cannot compare the commits.
    ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)docs/"'

[build.environment]
    NODE_VERSION = "20"

[[plugins]]
    package = "@netlify/plugin-nextjs"

[context.production]
    command = "npm run build"

[context.deploy-preview]
    command = "npm run build"

[context.branch-deploy]
    command = "npm run build"
